[project]
name = "cleaning-robot-challenge"
version = "0.1.0"
description = "Top-down video analyser for the EV3 Mindstorms cleaning robot challenge"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "opencv-contrib-python>=4.13.0.92",
]

[project.scripts]
analyze-robot   = "cleaning_robot_challenge.cli:main"
generate-markers = "cleaning_robot_challenge.generate_markers:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleaning_robot_challenge"]
